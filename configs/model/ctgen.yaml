# WARP-CT model: rectified-flow 3D U-Net in the Wan2.1 VAE latent space (16 x 64^3),
# RadFinder navg tokens -> cross-attention, pooled text -> AdaGN, U-REPA to SPECTRE tokens.
_target_: src.models.module.T2CTModule
lr: 3.0e-4
cfg_drop_prob: 0.15        # per-sample text dropout for classifier-free guidance
lr_scheduler_power: 2.0    # PolynomialLR after linear warmup
warmup_steps: 1000
repa_weight: 0.5           # L = L_velocity + 0.5 * (L_cos + 3 * L_rel)

unet:
  _target_: src.models.unet.ReportUNet3D
  spatial_dims: 3
  in_channels: 16
  out_channels: 16
  num_channels: [64, 128, 256, 512]
  num_res_blocks: 2
  attention_levels: [false, false, true, true]
  num_head_channels: [0, 0, 32, 32]
  cross_attention_dim: 1024      # RadFinder hidden width, no projector
  text_pooled_dim: 4096          # (EOS 1024 + masked mean 1024) x (findings, impression)
  num_class_embeds: 128
  include_fc: true
  include_spacing_input: true
  include_top_region_index_input: false
  include_bottom_region_index_input: false
  resblock_updown: true
  with_conditioning: true
  use_flash_attention: true

noise_scheduler:
  _target_: src.models.rflow.RFlowScheduler
  num_train_timesteps: 1000
  scale: 1.4                     # only read by the logit-normal sampler (unused with uniform)
  use_timestep_transform: true
  use_discrete_timesteps: false
  sample_method: uniform

repa:
  _target_: src.models.repa.RepaAligner
  student_channels: 512          # middle_block output (B, 512, 8, 8, 8)
  teacher_dim: 1080              # SPECTRE ViT-L token width
  student_grid: [8, 8, 8]
  teacher_grid: [16, 16, 16]
  crop_tokens: [4, 4, 4]
  projector: mlp
  upsample: trilinear
  spatial_norm_teacher: true
  gamma: 1.0
  hard_weight: 1.0
  rel_weight: 3.0
  rel_loss: urepa_l2
  rel_scope: global
  global_weight: 0.0
