# @package _global_
# WARP-CT submission model: full CT-RATE train set, 2 GPUs x batch 12, 150 epochs.
# The submitted weights are the EMA after the last epoch (checkpoints/last.ckpt).
defaults:
  - override /data: ctgen
  - override /model: ctgen

task_name: ctgen

data:
  batch_size: 12

model:
  lr: 3e-4
  warmup_steps: 1000

trainer:
  devices: 2
  strategy: ddp
  gradient_clip_val: 5.0
  max_epochs: 150
